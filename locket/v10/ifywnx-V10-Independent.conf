#!name=IFYWNX-V10-Independent
#!desc=Standalone caption experiment; no subscription modifications
#!configUrl=https://raw.githubusercontent.com/ifywnx/test/main/locket/v10/ifywnx-V10-Independent.conf

[General]
bypass-system = true
skip-proxy = *.local

[Rule]
FINAL,DIRECT

[Script]
locket_v10_captions = type=http-response, pattern=^https:\/\/firebaseremoteconfig\.googleapis\.com\/v1\/projects\/locket-4252a\/.+, script-path=https://raw.githubusercontent.com/ifywnx/test/main/locket/v10/Locket_V10_Captions.js, requires-body=true, max-size=524288, timeout=60

[MITM]
hostname = firebaseremoteconfig.googleapis.com
